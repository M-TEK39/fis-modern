services:
  # SQL Server 2019 Database Only - for local development
  mssql:
    image: mcr.microsoft.com/mssql/server:2019-latest
    container_name: fis-mssql19-dev
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-Behox@1903}"
      MSSQL_PID: "Developer"
      MSSQL_TCP_PORT: "1433"
      TZ: "Africa/Johannesburg"
    ports:
      - "${MSSQL_HOST_PORT:-1433}:1433"
    volumes:
      - fis-mssql-dev-data:/var/opt/mssql
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "(/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\" || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -Q \"SELECT 1\") >/dev/null 2>&1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Database initialization
  db-init:
    image: mcr.microsoft.com/mssql-tools:latest
    environment:
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-Behox@1903}"
      MSSQL_DB_NAME: "${MSSQL_DB_NAME:-fis_dev}"
      MSSQL_APP_LOGIN: "${MSSQL_APP_LOGIN:-fis_dev_app}"
      MSSQL_APP_PASSWORD: "${MSSQL_APP_PASSWORD:-fis_dev_app@1903}"
    depends_on:
      mssql:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        SQLCMD="/opt/mssql-tools18/bin/sqlcmd"; [ -x "$$SQLCMD" ] || SQLCMD="/opt/mssql-tools/bin/sqlcmd"; case "$$MSSQL_DB_NAME" in fis_dev|fis_dev_*|fis_test|fis_test_*) ;; *) echo 'Refusing to initialize a non-development database name.' >&2; exit 1 ;; esac; case "$$MSSQL_DB_NAME" in *[!A-Za-z0-9_-]*|'') echo 'Refusing an unsafe development database name.' >&2; exit 1 ;; esac; case "$$MSSQL_APP_LOGIN" in *[!A-Za-z0-9_-]*|'') echo 'Refusing an unsafe development login name.' >&2; exit 1 ;; esac; case "$$MSSQL_APP_PASSWORD" in *"'"*) echo 'Refusing a development password containing an unsafe SQL quote.' >&2; exit 1 ;; esac; until "$$SQLCMD" -S mssql -U sa -P "$$MSSQL_SA_PASSWORD" -Q "SELECT 1" >/dev/null 2>&1; do echo 'Waiting for SQL Server to be ready...'; sleep 5; done; echo 'SQL Server is ready. Initializing database...'; "$$SQLCMD" -S mssql -U sa -P "$$MSSQL_SA_PASSWORD" -Q "IF DB_ID('$$MSSQL_DB_NAME') IS NULL CREATE DATABASE [$$MSSQL_DB_NAME];" && "$$SQLCMD" -S mssql -U sa -P "$$MSSQL_SA_PASSWORD" -d "$$MSSQL_DB_NAME" -Q "IF NOT EXISTS (SELECT name FROM sys.sql_logins WHERE name = '$$MSSQL_APP_LOGIN') BEGIN CREATE LOGIN [$$MSSQL_APP_LOGIN] WITH PASSWORD = '$$MSSQL_APP_PASSWORD', CHECK_POLICY = ON; END IF NOT EXISTS (SELECT 1 FROM sys.database_principals WHERE name = '$$MSSQL_APP_LOGIN') BEGIN CREATE USER [$$MSSQL_APP_LOGIN] FOR LOGIN [$$MSSQL_APP_LOGIN]; EXEC sp_addrolemember N'db_owner', N'$$MSSQL_APP_LOGIN'; END" && echo 'Database initialization completed successfully.';

  # Local-only clean-install schema bootstrap. This never runs against a client database.
  db-bootstrap:
    image: mcr.microsoft.com/dotnet/sdk:8.0
    working_dir: /tmp
    volumes:
      - ..:/src
    command: ["dotnet", "run", "--project", "/src/src/Tools/DatabaseDevelopmentTool/DatabaseDevelopmentTool.csproj", "--", "--confirm=FIS-DEVELOPMENT-DATABASE"]
    environment:
      ConnectionStrings__Default: "Server=mssql,1433;Database=${MSSQL_DB_NAME:-fis_dev};User Id=sa;Password=${MSSQL_SA_PASSWORD:-Behox@1903};Encrypt=False;TrustServerCertificate=True;"
      DOTNET_ENVIRONMENT: "Development"
      FIS_ALLOW_DEVELOPMENT_DATABASE_BOOTSTRAP: "I_UNDERSTAND_LOCAL_DATABASE_BOOTSTRAP"
    depends_on:
      db-init:
        condition: service_completed_successfully
    restart: "no"

  # Explicit local demo data only. Production Compose has no equivalent service.
  db-seed:
    image: mcr.microsoft.com/dotnet/sdk:8.0
    working_dir: /tmp
    volumes:
      - ..:/src
    command: ["dotnet", "run", "--project", "/src/src/Tools/DatabaseSeederTool/DatabaseSeederTool.csproj", "--", "--confirm=FIS-DEVELOPMENT-SEED"]
    environment:
      ConnectionStrings__Default: "Server=mssql,1433;Database=${MSSQL_DB_NAME:-fis_dev};User Id=sa;Password=${MSSQL_SA_PASSWORD:-Behox@1903};Encrypt=False;TrustServerCertificate=True;"
      DOTNET_ENVIRONMENT: "Development"
      FIS_ALLOW_DEVELOPMENT_SEEDING: "I_UNDERSTAND_DEVELOPMENT_SEEDING"
    depends_on:
      db-bootstrap:
        condition: service_completed_successfully
    profiles:
      - seed
    restart: "no"

  # Local API runtime. Production Compose uses the external client SQL Server;
  # this service connects only to the disposable local mssql service above.
  fis-api-dev:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: fis-api-dev
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ASPNETCORE_URLS: "http://+:8080"
      TZ: "Africa/Johannesburg"
      ConnectionStrings__Default: "Server=mssql,1433;Database=${MSSQL_DB_NAME:-fis_dev};User Id=sa;Password=${MSSQL_SA_PASSWORD:-Behox@1903};Encrypt=False;TrustServerCertificate=True;"
      ApiSettings__WebBaseUrl: "http://localhost:${FIS_WEB_HOST_PORT:-3000}"
      Cors__Origins__0: "http://localhost:${FIS_WEB_HOST_PORT:-3000}"
    ports:
      - "${FIS_API_HOST_PORT:-5010}:8080"
    volumes:
      - fis-uploads-dev:/app/uploads
    depends_on:
      db-bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  # Local Next.js runtime. The API base URL is internal to the Compose network.
  fis-web-next-dev:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web-next
    container_name: fis-web-next-dev
    environment:
      NODE_ENV: "production"
      NEXT_TELEMETRY_DISABLED: "1"
      API_BASE_URL: "http://fis-api-dev:8080"
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      TZ: "Africa/Johannesburg"
    ports:
      - "${FIS_WEB_HOST_PORT:-3000}:3000"
    depends_on:
      fis-api-dev:
        condition: service_healthy
    restart: unless-stopped

volumes:
  fis-mssql-dev-data:
    driver: local
  fis-uploads-dev:
    driver: local
