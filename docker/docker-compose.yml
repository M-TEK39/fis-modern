version: '3.8'

services:
  # SQL Server is hosted externally on Windows. Set DB_HOST in the deployment
  # environment to the Windows server address; 192.0.2.10 is documentation-only.

  # FIS API Service
  fis-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: fis-api
    env_file:
      - ../.env
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Production}
      - ASPNETCORE_URLS=http://+:8080
      - TZ=Africa/Johannesburg
      - ApiSettings__WebBaseUrl=https://${SERVER_HOSTNAME:-${SERVER_IP:-localhost}}
      - AzureAd__TenantId=${AzureAd__TenantId:-}
      - AzureAd__ClientId=${AzureAd__ClientId:-}
      - AzureAd__ClientSecret=${AzureAd__ClientSecret:-}
      - AzureAd__CallbackPath=/signin-microsoft
      - Cors__Origins__0=https://localhost
      - Cors__Origins__1=https://${SERVER_IP:-localhost}
      - Cors__Origins__2=https://${SERVER_HOSTNAME:-localhost}
    expose:
      - "8080"
    volumes:
      - fis-uploads:/app/uploads
    restart: unless-stopped
    healthcheck:
      # The web tier must not start until the API can reach its SQL dependency.
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - fis-network

  # Next.js frontend
  fis-web-next:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web-next
    container_name: fis-web-next
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
      - API_BASE_URL=http://fis-api:8080
      - MICROSOFT_SIGN_IN_ENABLED=${AzureAd__ClientId:-}
      - MICROSOFT_SIGN_IN_URL=/api/auth/microsoft/sign-in
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - TZ=Africa/Johannesburg
    expose:
      - "3000"
    depends_on:
      fis-api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - fis-network

  # nginx TLS terminator — exposes HTTPS on 443 (web) and 5443 (API)
  nginx:
    image: nginx:1.27-alpine
    container_name: fis-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "5443:5443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      fis-api:
        condition: service_healthy
      fis-web-next:
        condition: service_healthy
    networks:
      - fis-network

  # Database migration tool (run on demand)
  db-migrate:
    image: mcr.microsoft.com/dotnet/sdk:8.0
    container_name: fis-db-migrate
    working_dir: /tmp
    volumes:
      - ..:/src
    env_file:
      - ../.env
    command: ["dotnet", "run", "--project", "/src/src/Tools/DatabaseMigrationTool/DatabaseMigrationTool.csproj", "--"]
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Production}
      - FIS_ALLOW_PRODUCTION_MIGRATIONS=${FIS_ALLOW_PRODUCTION_MIGRATIONS:-}
      - FIS_MIGRATION_OPERATOR=${FIS_MIGRATION_OPERATOR:-}
    restart: "no"
    profiles:
      - tools
    networks:
      - fis-network

  # Read-only data-quality audit (run on demand; emits text, JSON, or CSV).
  db-audit:
    image: mcr.microsoft.com/dotnet/sdk:8.0
    container_name: fis-db-audit
    working_dir: /tmp
    volumes:
      - ..:/src
    env_file:
      - ../.env
    command: ["dotnet", "run", "--project", "/src/src/Tools/DatabaseAuditTool/DatabaseAuditTool.csproj", "--"]
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Production}
    restart: "no"
    profiles:
      - tools
    networks:
      - fis-network

  # Reviewed data back-fix (run on demand; validation is the default).
  db-backfix:
    image: mcr.microsoft.com/dotnet/sdk:8.0
    container_name: fis-db-backfix
    working_dir: /tmp
    volumes:
      - ..:/src
    env_file:
      - ../.env
    command: ["dotnet", "run", "--project", "/src/src/Tools/DatabaseBackfixTool/DatabaseBackfixTool.csproj", "--"]
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Production}
      - FIS_ALLOW_PRODUCTION_DATA_FIXES=${FIS_ALLOW_PRODUCTION_DATA_FIXES:-}
    restart: "no"
    profiles:
      - tools
    networks:
      - fis-network

  # Cloudflare tunnel (run on demand)
  cloudflared:
    image: cloudflare/cloudflared:2026.2.0
    container_name: fis-cloudflared
    command: ["tunnel", "--no-autoupdate", "run", "--token", "${CLOUDFLARED_TOKEN}"]
    depends_on:
      fis-api:
        condition: service_healthy
      fis-web-next:
        condition: service_started
    restart: unless-stopped
    profiles:
      - tunnel
    networks:
      - fis-network

volumes:
  fis-uploads:
    driver: local

networks:
  fis-network:
    driver: bridge
