version: '3.8'

services:
  # SQL Server 2019 Database
  mssql:
    image: mcr.microsoft.com/mssql/server:2019-latest
    container_name: fis-mssql19
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Behox@1903"
      MSSQL_PID: "Developer"
      TZ: "Africa/Johannesburg"
    ports:
      - "1433:1433"
    volumes:
      - fis-mssql-data:/var/opt/mssql
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "/opt/mssql-tools/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "Behox@1903", "-Q", "SELECT 1" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - fis-network

  # Database initialization
  db-init:
    image: mcr.microsoft.com/mssql-tools:latest
    depends_on:
      mssql:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: |
      until /opt/mssql-tools/bin/sqlcmd -S mssql -U sa -P 'Behox@1903' -Q "SELECT 1" >/dev/null 2>&1;
      do 
        echo 'Waiting for SQL Server to be ready...'; 
        sleep 5; 
      done;
      echo 'SQL Server is ready. Initializing database...';
      /opt/mssql-tools/bin/sqlcmd -S mssql -U sa -P 'Behox@1903' -Q "IF DB_ID('IFMS') IS NULL CREATE DATABASE [IFMS];" &&
      /opt/mssql-tools/bin/sqlcmd -S mssql -U sa -P 'Behox@1903' -d IFMS -Q "
        IF NOT EXISTS (SELECT name FROM sys.sql_logins WHERE name = 'ifms')
          BEGIN 
            CREATE LOGIN [ifms] WITH PASSWORD = 'ifms@12345', CHECK_POLICY = ON; 
          END
        IF NOT EXISTS (SELECT 1 FROM sys.database_principals WHERE name = 'ifms')
          BEGIN 
            CREATE USER [ifms] FOR LOGIN [ifms]; 
            EXEC sp_addrolemember N'db_owner', N'ifms'; 
          END
      " &&
      echo 'Database initialization completed successfully.';
    networks:
      - fis-network

  # FIS API Service
  fis-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: fis-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__Default=Server=mssql,1433;Database=IFMS;User Id=sa;Password=Behox@1903;Encrypt=True;TrustServerCertificate=True;
    ports:
      - "5000:8080"
    depends_on:
      mssql:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - fis-network

  # FIS Web Application
  fis-web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    container_name: fis-web
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ApiSettings__BaseUrl=http://fis-api:8080
    ports:
      - "5001:8080"
    depends_on:
      fis-api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - fis-network

volumes:
  fis-mssql-data:
    driver: local

networks:
  fis-network:
    driver: bridge