version: '3.8'

services:
  # SQL Server is hosted externally on Windows. Set DB_HOST in the deployment
  # environment to the Windows server address; 192.0.2.10 is documentation-only.

  # FIS API Service
  fis-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: fis-api
    env_file:
      - ../.env
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Production}
      - ASPNETCORE_URLS=http://+:8080
      - TZ=Africa/Johannesburg
      - ConnectionStrings__Default=${ConnectionStrings__Default:-Server=${DB_HOST:-192.0.2.10},${DB_PORT:-1433};Database=${DB_NAME:-legacy};User Id=${DB_USER:-YOUR_DB_USER};Password=${DB_PASSWORD:-YOUR_DB_PASSWORD};Encrypt=${DB_ENCRYPT:-False};TrustServerCertificate=${DB_TRUST_SERVER_CERTIFICATE:-True};}
      - Cors__Origins__0=https://localhost
      - Cors__Origins__1=https://${SERVER_IP:-localhost}
      - Cors__Origins__2=https://${SERVER_HOSTNAME:-localhost}
    expose:
      - "8080"
    volumes:
      - fis-uploads:/app/uploads
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - fis-network

  # FIS Web Application
  fis-web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    container_name: fis-web
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Production}
      - ASPNETCORE_URLS=http://+:8080
      - TZ=Africa/Johannesburg
      - ApiSettings__BaseUrl=http://fis-api:8080
      - ApiSettings__WebBaseUrl=https://${SERVER_HOSTNAME:-${SERVER_IP:-localhost}}
      # Keep Microsoft Identity fallback enabled when its deployment secrets
      # are supplied through the environment; values are never committed here.
      - AzureAd__TenantId=${AzureAd__TenantId:-}
      - AzureAd__ClientId=${AzureAd__ClientId:-}
      - AzureAd__ClientSecret=${AzureAd__ClientSecret:-}
    expose:
      - "8080"
    depends_on:
      fis-api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - fis-network

  # Next.js frontend — migrated routes during Blazor coexistence
  fis-web-next:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web-next
    container_name: fis-web-next
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
      - API_BASE_URL=http://fis-api:8080
      - MICROSOFT_SIGN_IN_ENABLED=${AzureAd__ClientId:-}
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - TZ=Africa/Johannesburg
    expose:
      - "3000"
    depends_on:
      fis-api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - fis-network

  # nginx TLS terminator — exposes HTTPS on 443 (web) and 5443 (API)
  nginx:
    image: nginx:1.27-alpine
    container_name: fis-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "5443:5443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      fis-api:
        condition: service_healthy
      fis-web:
        condition: service_started
      fis-web-next:
        condition: service_started
    networks:
      - fis-network

  # Database migration tool (run on demand)
  db-migrate:
    image: mcr.microsoft.com/dotnet/sdk:8.0
    container_name: fis-db-migrate
    working_dir: /tmp
    volumes:
      - ..:/src
    command: ["dotnet", "run", "--project", "/src/src/Tools/DatabaseMigrationTool/DatabaseMigrationTool.csproj"]
    environment:
      - ConnectionStrings__Default=${ConnectionStrings__Default:-Server=${DB_HOST:-192.0.2.10},${DB_PORT:-1433};Database=${DB_NAME:-legacy};User Id=${DB_USER:-YOUR_DB_USER};Password=${DB_PASSWORD:-YOUR_DB_PASSWORD};Encrypt=${DB_ENCRYPT:-False};TrustServerCertificate=${DB_TRUST_SERVER_CERTIFICATE:-True};}
      - DOTNET_ENVIRONMENT=Development
    restart: "no"
    profiles:
      - tools
    networks:
      - fis-network

  # Database seeder tool (run on demand)
  db-seed:
    image: mcr.microsoft.com/dotnet/sdk:8.0
    container_name: fis-db-seed
    working_dir: /tmp
    volumes:
      - ..:/src
    command: ["dotnet", "run", "--project", "/src/src/Tools/DatabaseSeederTool/DatabaseSeederTool.csproj"]
    environment:
      - ConnectionStrings__Default=${ConnectionStrings__Default:-Server=${DB_HOST:-192.0.2.10},${DB_PORT:-1433};Database=${DB_NAME:-legacy};User Id=${DB_USER:-YOUR_DB_USER};Password=${DB_PASSWORD:-YOUR_DB_PASSWORD};Encrypt=${DB_ENCRYPT:-False};TrustServerCertificate=${DB_TRUST_SERVER_CERTIFICATE:-True};}
      - DOTNET_ENVIRONMENT=Development
    restart: "no"
    profiles:
      - tools
    networks:
      - fis-network

  # Cloudflare tunnel (run on demand)
  cloudflared:
    image: cloudflare/cloudflared:2026.2.0
    container_name: fis-cloudflared
    command: ["tunnel", "--no-autoupdate", "run", "--token", "${CLOUDFLARED_TOKEN}"]
    depends_on:
      fis-api:
        condition: service_healthy
      fis-web:
        condition: service_started
      fis-web-next:
        condition: service_started
    restart: unless-stopped
    profiles:
      - tunnel
    networks:
      - fis-network

volumes:
  fis-uploads:
    driver: local

networks:
  fis-network:
    driver: bridge
