            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
            proxy_buffering off;
        }

        # Next.js owns the migrated routes. Exact matches keep all other paths
        # on Blazor until their own replacement slice is verified.
        location = / {
            proxy_pass http://fis-web-next:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
