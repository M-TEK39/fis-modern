# Let nginx match the available CPU capacity in the production container while
# retaining the existing per-worker connection limit.
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Compress only text-based responses. This includes proxied Next.js/API
    # responses but deliberately excludes already-compressed documents and
    # binary uploads. gzip_vary keeps compressed and uncompressed variants
    # correct for downstream caches; nginx does not proxy-cache these responses.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        application/atom+xml
        application/javascript
        application/json
        application/ld+json
        application/manifest+json
        application/rss+xml
        application/vnd.geo+json
        application/wasm
        application/xhtml+xml
        application/xml
        image/svg+xml
        text/css
        text/plain
        text/x-component
        text/xml;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Keep the upstream Next.js cache policy when it already supplies one.
    # The fallback is only used for a valid static response that omitted it,
    # preventing duplicate Cache-Control fields on normal Next assets.
    map $upstream_http_cache_control $next_static_cache_control {
        ""      "public, max-age=31536000, immutable";
        default "";
    }

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'request_time=$request_time '
                    'upstream_status="$upstream_status" '
                    'upstream_connect_time="$upstream_connect_time" '
                    'upstream_header_time="$upstream_header_time" '
                    'upstream_response_time="$upstream_response_time"';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # Larger uploads (documents/photos up to 20MB per appsettings)
    client_max_body_size 25M;

    # Modern TLS only
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Redirect all HTTP to HTTPS
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # FIS Web (Next.js) — port 443 (default HTTPS)
    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/certs/fis.crt;
        ssl_certificate_key /etc/nginx/certs/fis.key;

        # Security headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Microsoft sign-in is owned by the C# API. Keep the authorization
        # request and callback on the public web origin so the registered
        # redirect URI does not depend on the separate API port.
        location ^~ /api/auth/microsoft/ {
            proxy_pass http://fis-api:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
            proxy_buffering off;
        }

        location = /signin-microsoft {
            proxy_pass http://fis-api:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
